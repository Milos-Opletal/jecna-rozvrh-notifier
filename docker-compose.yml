services:
  jecna-notifier:
    build: .
    image: jecna-rozvrh-notifier:latest
    container_name: jecna-rozvrh-notifier
    restart: unless-stopped
    volumes:
      - jecna-data:/data
    environment:
      # Check interval in seconds (900 = 15 minutes)
      - CHECK_INTERVAL_SECONDS=${CHECK_INTERVAL_SECONDS:-900}

      # Student class (e.g. C4b)
      - CLASS_NAME=${CLASS_NAME:-C4b}

      # Whether to send alerts on very first run for existing entries (default: false)
      - ALERT_ON_STARTUP=${ALERT_ON_STARTUP:-false}

      # When a change is detected, repeat all currently active changes in the notification (default: true)
      - REPEAT_ALL_CHANGES=${REPEAT_ALL_CHANGES:-true}

      # Morning daily overview notification options
      - MORNING_NOTIFICATION_ENABLED=${MORNING_NOTIFICATION_ENABLED:-true}
      - MORNING_NOTIFICATION_TIME=${MORNING_NOTIFICATION_TIME:-07:00}
      - MORNING_NOTIFICATION_TARGETS=${MORNING_NOTIFICATION_TARGETS:-all}
      - MORNING_NOTIFICATION_ONLY_IF_CHANGES=${MORNING_NOTIFICATION_ONLY_IF_CHANGES:-true}

      # Substitution API URL
      - SUBSTITUTION_API_URL=${SUBSTITUTION_API_URL:-https://jecnarozvrh.jzitnik.dev/versioned/v3}

      # --- WEBHOOK DESTINATIONS (fill in any you want to use) ---

      # 1. Home Assistant Webhook URL
      # In Home Assistant: Settings -> Automations -> Trigger: Webhook (webhook_id)
      # Format: http://<HA_HOST>:8123/api/webhook/<WEBHOOK_ID>
      - HOMEASSISTANT_WEBHOOK_URL=${HOMEASSISTANT_WEBHOOK_URL:-}

      # 2. Discord Webhook URL (creates rich embed with fields)
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}

      # 3. Telegram Bot Notifications
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}

      # 4. ntfy.sh (Instant mobile push notifications without extra infrastructure)
      # e.g. https://ntfy.sh/jecna_supl_notifikace
      - NTFY_URL=${NTFY_URL:-}

      # 5. Slack Incoming Webhook
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}

      # 6. Generic HTTP POST JSON Webhook (Gotify, custom server, etc.)
      - GENERIC_WEBHOOK_URL=${GENERIC_WEBHOOK_URL:-}

    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  jecna-data:
    name: jecna-data
